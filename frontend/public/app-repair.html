<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Update Expo Buddy</title>
    <style>
      :root {
        font:
          16px/1.6 system-ui,
          sans-serif;
        color: #243b32;
        background: #f5f8f6;
      }
      body {
        max-width: 640px;
        margin: 10vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }
      button,
      a {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 14px 20px;
        background: #166b58;
        color: white;
        cursor: pointer;
        min-height: 48px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #166b58;
        outline-offset: 4px;
      }
      #status {
        white-space: pre-wrap;
        padding: 20px 0;
      }
      a {
        color: #166b58;
      }
    </style>
    <script src="/app-repair.js?network=1" defer></script>
  </head>
  <body>
    <h1>Open the latest Expo Buddy</h1>
    <p>
      This page checks the live server directly, even when the installed app is showing an older
      version.
    </p>
    <p>
      Finish any unsaved typing first. Updating keeps your queued photos, notes, provider
      connections, and library data.
    </p>
    <p id="status" role="status">Checking your connection…</p>
    <button id="update" disabled>Update and open library</button>
    <p><a href="/">Return to library</a></p>
  </body>
</html>
