[project]
name = "expo-buddy"
version = "0.0.1"
license = "MIT"
description = "Private, self-hosted expo contact and document library"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.0.55",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "Pillow==13.0.0",
  "pillow-heif==1.8.1",
  "pypdf==6.21.3",
  "cryptography==50.0.2",
  "phonenumbers==9.0.42",
  "email-validator==2.3.0",
  "tokenizers==0.23.3",
  "openpyxl==3.1.5",
  "mcp==2.3.0",
  "PyJWT==2.15.1",
  "tzdata==2026.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3", "reportlab==5.1.0", "pypdfium2==5.14.0", "imagehash==4.3.2", "opencv-python-headless==4.10.0.84"]
worker = ["sentence-transformers==6.2.0", "torch @ https://download-r2.pytorch.org/whl/cpu/torch-2.9.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=7417d8c565f219d3455654cb431c6d892a3eb40246055e14d645422de13b9ea1", "paddleocr==3.7.0", "paddlepaddle==3.3.1", "pypdfium2==5.14.0", "imagehash==4.3.2", "opencv-python-headless==4.10.0.84"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the running Docker Compose stack"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]
"app/db/migrations/versions/*" = ["E501"]

