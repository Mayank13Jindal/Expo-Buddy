name: Stack
# Builds the real Docker stack, then runs the integration and browser tests against it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_URL: https://localhost:8443
      E2E_PASSWORD: fake-e2e-password-123
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the image builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create settings with password sign-in
        run: |
          echo '{"passwordless": false}' > "$RUNNER_TEMP/expo-buddy.json"
          python3 scripts/setup.py --local --config "$RUNNER_TEMP/expo-buddy.json"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            .local/data/models/ocr
            .local/data/models/embeddings
          key: models-${{ hashFiles('models.lock.json') }}
      - name: Download models
        run: |
          python3 scripts/download_models.py --kind ocr
          python3 scripts/download_models.py --kind embeddings
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Integration tests
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pytest -m integration -q
        working-directory: backend
      - name: Trust the stack's local HTTPS certificate
        run: |
          sudo apt-get install -y libnss3-tools
          ./scripts/trust-local-ca.sh
      - name: Create the test account
        run: |
          curl -sSf --cacert .secrets/caddy-data/caddy/pki/authorities/local/root.crt \
            -X POST "$APP_URL/api/v1/auth/setup" \
            -H "Origin: $APP_URL" -H 'Content-Type: application/json' \
            -d "{\"password\": \"$E2E_PASSWORD\"}"
      - name: Browser tests
        working-directory: frontend
        env:
          # Playwright's own Node requests (page.request, route.fetch) need the CA too.
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.secrets/caddy-data/caddy/pki/authorities/local/root.crt
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail=200
