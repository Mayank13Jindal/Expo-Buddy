# Monthly, grouped dependency updates. CI (Checks and the full Stack run) verifies each PR.
# Python lockfiles are generated by `uv pip compile --generate-hashes`; refresh them by hand
# (see CONTRIBUTING.md). GitHub security alerts still cover them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node is pinned to 24.x (frontend/.nvmrc and package.json engines).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /deploy]
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
    ignore:
      # The backend requires Python 3.12 and the frontend build Node 24.
      - dependency-name: python
        versions: ['>=3.13']
      - dependency-name: node
        versions: ['>=25']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
